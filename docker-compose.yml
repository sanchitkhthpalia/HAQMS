version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: haqms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haqms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haqms-backend
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/haqms?schema=public
      JWT_SECRET: my-super-secret-secret-key-12345!!!
      PORT: 5000
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: haqms-frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
